<title>PersonalPaper Layout Mockups</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lexend:wght@400;500;600;700&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;0,6..72,600;0,6..72,700;1,6..72,400&display=swap">
<style>
  /* Layout: a control bar, then one of three renderings of the same edition. Fonts and size are switchable so each layout can be read in each face. */
  :root {
    --bg: #f6f4ef; --panel: #fdfcfa; --fg: #1e1c19; --muted: #6b665d; --line: #d9d4cb; --accent: #8a2a1b; --accent-soft: #f1e3df;
    --body: Georgia, "Times New Roman", serif;
    --display: "Newsreader", Georgia, serif;
    --ui: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    --base: 18px; --lh: 1.6; --measure: 36rem;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { --bg: #151517; --panel: #1d1d20; --fg: #e8e5df; --muted: #9d978e; --line: #2f2e32; --accent: #e07a5f; --accent-soft: #3a2420; color-scheme: dark; }
  }
  :root[data-theme="dark"] { --bg: #151517; --panel: #1d1d20; --fg: #e8e5df; --muted: #9d978e; --line: #2f2e32; --accent: #e07a5f; --accent-soft: #3a2420; color-scheme: dark; }
  :root[data-font="lexend"] { --body: "Lexend", sans-serif; --display: "Lexend", sans-serif; }
  :root[data-font="atkinson"] { --body: "Atkinson Hyperlegible", sans-serif; --display: "Atkinson Hyperlegible", sans-serif; }
  :root[data-font="system"] { --body: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; --display: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  :root[data-font="serif"] { --body: Georgia, "Times New Roman", serif; --display: "Newsreader", Georgia, serif; }
  :root[data-size="large"] { --base: 21px; --lh: 1.65; }
  :root[data-size="small"] { --base: 16px; --lh: 1.55; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font-family: var(--body); font-size: var(--base); line-height: var(--lh); -webkit-font-smoothing: antialiased; }
  a { color: inherit; }
  img { max-width: 100%; display: block; }
  .bar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); font-family: var(--ui); font-size: 14px; padding: 8px 16px; display: flex; flex-wrap: wrap; gap: 8px 16px; align-items: center; }
  .bar .group { display: flex; gap: 6px; align-items: center; flex-wrap: wrap; }
  .bar label { color: var(--muted); }
  .bar button, .bar select { font: inherit; padding: 6px 10px; border: 1px solid var(--line); border-radius: 999px; background: var(--panel); color: var(--fg); min-height: 34px; }
  .bar button[aria-pressed="true"] { background: var(--fg); color: var(--bg); border-color: var(--fg); }
  .bar button:focus-visible, .bar select:focus-visible, main a:focus-visible, main summary:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
  main { padding-inline: 16px; padding-block: 24px 80px; }
  .note { font-family: var(--ui); font-size: 14px; color: var(--muted); max-width: 60ch; margin: 0 auto 20px; }
  .badge { font-family: var(--ui); font-size: 12px; letter-spacing: .04em; text-transform: uppercase; color: var(--muted); border: 1px solid var(--line); border-radius: 4px; padding: 1px 6px; vertical-align: middle; }
  .sub { font-family: var(--ui); font-size: 12px; color: var(--muted); }
  figcaption { font-family: var(--ui); font-size: 12px; color: var(--muted); margin-top: 4px; }
  .meta { font-family: var(--ui); font-size: 14px; color: var(--muted); }
  .meta a { color: var(--accent); text-decoration: none; }

  /* ---------- A. Reader ---------- */
  .reader { max-width: var(--measure); margin: 0 auto; }
  .reader .masthead { margin-bottom: 1.6rem; }
  .reader .masthead h1 { font-family: var(--display); font-size: 1.9rem; margin: 0; line-height: 1.15; }
  .reader .masthead .date { font-family: var(--ui); color: var(--muted); font-size: 14px; margin-top: 4px; }
  .reader .top { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; padding: 1rem 1.2rem; margin-bottom: 2rem; }
  .reader .top h2 { font-family: var(--ui); font-size: 13px; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); margin: 0 0 .6rem; }
  .reader .top ol { margin: 0; padding-left: 1.4rem; }
  .reader .top li { margin: .55rem 0; }
  .reader .top li a { font-weight: 700; text-decoration: none; }
  .reader .top li .lede { display: block; color: var(--muted); font-size: .92em; }
  .reader h2.cat { font-family: var(--ui); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--accent); border-left: 4px solid var(--accent); padding-left: .6rem; margin: 2.4rem 0 1rem; }
  .reader article { padding: 0 0 1.4rem; margin-bottom: 1.4rem; border-bottom: 1px solid var(--line); }
  .reader article:last-child { border-bottom: 0; }
  .reader h3 { font-family: var(--display); font-size: 1.35em; line-height: 1.25; margin: 0 0 .35rem; font-weight: 700; }
  .reader p { margin: .55rem 0 0; }
  .reader .also { font-family: var(--ui); font-size: 13px; color: var(--muted); margin-top: .5rem; }

  /* ---------- B. Editorial ---------- */
  .editorial { max-width: 64rem; margin: 0 auto; }
  .editorial .masthead { text-align: center; border-bottom: 3px double var(--fg); padding-bottom: .8rem; margin-bottom: 1.4rem; }
  .editorial .masthead h1 { font-family: var(--display); font-size: 2.6rem; font-weight: 600; margin: 0; letter-spacing: -.01em; line-height: 1.05; }
  .editorial .masthead .date { font-family: var(--ui); font-size: 13px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); margin-top: .4rem; }
  .editorial .kicker { font-family: var(--ui); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--accent); font-weight: 600; }
  .editorial .topgrid { display: grid; grid-template-columns: 1fr; gap: 1.4rem; margin-bottom: 2.2rem; }
  @media (min-width: 760px) { .editorial .topgrid { grid-template-columns: 1.6fr 1fr; grid-template-rows: auto auto; } .editorial .topgrid .lead { grid-row: 1 / span 2; } }
  .editorial .card { min-width: 0; }
  .editorial .card img { width: 100%; aspect-ratio: 16/9; object-fit: cover; border-radius: 4px; }
  .editorial .card.noimg .ph { aspect-ratio: 16/9; background: var(--accent-soft); border-radius: 4px; display: grid; place-items: center; font-family: var(--ui); font-size: 13px; color: var(--muted); }
  .editorial .card h3 { font-family: var(--display); font-weight: 600; line-height: 1.15; margin: .6rem 0 .3rem; }
  .editorial .lead h3 { font-size: 2rem; }
  .editorial .card:not(.lead) h3 { font-size: 1.35rem; }
  .editorial .card p { margin: .3rem 0 0; }
  .editorial .card:not(.lead) p { font-size: .95em; }
  .editorial .section { border-top: 1px solid var(--fg); padding-top: .5rem; margin-top: 2.2rem; }
  .editorial .section .kicker { display: block; margin-bottom: .8rem; }
  .editorial .row { display: grid; grid-template-columns: 1fr; gap: .8rem 1.2rem; padding: 1rem 0; border-top: 1px solid var(--line); }
  .editorial .row.hasimg { grid-template-columns: 150px 1fr; }
  @media (max-width: 520px) { .editorial .row.hasimg { grid-template-columns: 1fr; } }
  .editorial .row img { width: 100%; aspect-ratio: 4/3; object-fit: cover; border-radius: 3px; }
  .editorial .row h3 { font-family: var(--display); font-weight: 600; font-size: 1.35rem; line-height: 1.2; margin: 0 0 .25rem; }
  .editorial .row p { margin: .4rem 0 0; }
  .editorial .also { font-family: var(--ui); font-size: 13px; color: var(--muted); margin-top: .4rem; }

  /* ---------- C. Scan ---------- */
  .scan { max-width: 44rem; margin: 0 auto; }
  .scan .masthead { display: flex; align-items: baseline; justify-content: space-between; gap: 1rem; margin-bottom: .6rem; }
  .scan .masthead h1 { font-family: var(--display); font-size: 1.5rem; margin: 0; }
  .scan .chips { position: sticky; top: calc(env(safe-area-inset-top, 0px) + 51px); z-index: 5; background: var(--bg); display: flex; gap: 6px; overflow-x: auto; padding: 8px 0 10px; margin: 0 -16px; padding-inline: 16px; scrollbar-width: none; }
  .scan .chips::-webkit-scrollbar { display: none; }
  .scan .chips a { flex: none; font-family: var(--ui); font-size: 13px; padding: 5px 10px; border: 1px solid var(--line); border-radius: 999px; text-decoration: none; background: var(--panel); white-space: nowrap; }
  .scan .top { margin: .8rem 0 1.4rem; padding: .8rem 1rem; border-left: 4px solid var(--accent); background: var(--panel); }
  .scan .top div { font-weight: 700; margin: .25rem 0; }
  .scan h2.cat { font-family: var(--ui); font-size: 13px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); margin: 1.8rem 0 .4rem; display: flex; justify-content: space-between; }
  .scan details { border-top: 1px solid var(--line); }
  .scan summary { list-style: none; cursor: pointer; display: grid; grid-template-columns: 1fr; gap: .2rem .8rem; padding: .7rem 0; }
  .scan summary::-webkit-details-marker { display: none; }
  .scan summary.hasimg { grid-template-columns: 64px 1fr; }
  .scan summary img { width: 64px; height: 64px; object-fit: cover; border-radius: 6px; grid-row: 1 / span 2; }
  .scan summary .h { font-weight: 700; line-height: 1.3; }
  .scan summary .l { color: var(--muted); font-size: .92em; line-height: 1.4; }
  .scan details[open] summary .l { display: none; }
  .scan .body { padding: 0 0 1rem; }
  .scan .body p { margin: .3rem 0 .5rem; }
  .hidden { display: none; }
</style>

</div>

026/10/6/demonstrators-clash-with-riot-police-in-france-as-education-protests-mount", "pay": false}]}, {"id": "2026-10-17-albania-rama-refuses-to-resign", "cat": "europe", "catName": "Europe", "headline": "Albania's prime minister refuses to resign as student protests spread", "url": "https://www.aljazeera.com/news/2026/10/15/albanias-pm-dismisses-calls-to-resign-as-student-protests-spread", "publisher": "Al Jazeera", "date": "2026-10-15", "summary": "Edi Rama rejected an ultimatum from protesters to step down, saying it would betray the Albanians who gave him a strong mandate, after a third straight day of clashes in Tirana in which police used water cannon and tear gas and arrested 65 people. Hospitals treated 89 people on Wednesday, 61 of them police officers. The protests, which began among students and have spread to smaller cities, combine anger over education costs, corruption and the cost of living with opposition to a coastal luxury resort backed by Jared Kushner, whose land sale prosecutors suspect involved forged deeds.", "basis": "Al Jazeera", "ho": false, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAC0KADAAQAAAABAAACHAAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8IAEQgCHALQAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAMCBAEFAAYHCAkKC//EAMMQAAEDAwIEAwQGBAcGBAgGcwECAAMRBBIhBTETIhAGQVEyFGFxIweBIJFCFaFSM7EkYjAWwXLRQ5I0ggjhU0AlYxc18JNzolBEsoPxJlQ2ZJR0wmDShKMYcOInRTdls1V1pJXDhfLTRnaA40dWZrQJChkaKCkqODk6SElKV1hZWmdoaWp3eHl6hoeIiYqQlpeYmZqgpaanqKmqsLW2t7i5usDExcbHyMnK0NTV1tfY2drg5OXm5+jp6vP09fb3+Pn6/8QAHwEAAwEBAQEBAQEBAQAAAAAAAQIAAwQFBgcICQoL/8QAwxEAAgIBAwMDAgMFAgUCBASHAQACEQMQEiEEIDFBEwUwIjJRFEAGMyNhQhVxUjSBUCSRoUOxFgdiNVPw0SVgwUThcvEXgmM2cCZFVJInotIICQoYGRooKSo3ODk6RkdISUpVVldYWVpkZWZnaGlqc3R1dnd4eXqAg4SFhoeIiYqQk5SVlpeYmZqgo6SlpqeoqaqwsrO0tba3uLm6wMLDxMXGx8jJytDT1NXW19jZ2uDi4+Tl5ufo6ery8/T19vf4+fr/2wBDAAMDAwMDAwYDAwYIBgYGCAsICAgICw0L illing three children aged 5, 8 and 11 and a teacher, and critically wounding a 7-year-old and a second teacher, before a parent at the school followed him inside and shot him dead. The weapon was a pump-action shotgun that officials say belonged to his mother. Governor Tina Kotek said she was \"absolutely broken\"; all 32 schools in the Bend-La Pine district closed on Friday. It is the 28th mass killing in the United States this year by the count kept by the Associated Press, USA Today and Northeastern University.", "basis": "Associated Press", "ho": false, "img": null, "credit": null, "nw": 0.75, "also": [{"p": "New York Times", "u": "https://www.nytimes.com/2026/10/16/us/bend-shooting-hero-teacher-dad.html", "pay": true}]}, {"id": "2026-10-17-press-secretary-zacharia-ousted", "cat": "united-states", "catName": "United States", "headline": "Trump's new press secretary is out after five days", "url": "https://www.nytimes.com/2026/10/16/us/politics/katie-zacharia-fired-press-secretary.html", "publisher": "New York Times", "date": "2026-10-17", "summary": "Katie Zacharia, named White House press secretary on October 9 to succeed Karoline Leavitt, has been ousted after five days, the New York Times reported, amid questions about how she had described her legal career and about her first briefing. That briefing, on Tuesday, lasted about 14 minutes and took questions from three outlets; Trump said afterward that she had done \"excellent.\" Zacharia, 41, had been a communications adviser at Trump Media and, earlier this year, a Department of Homeland Security spokeswoman.", "basis": "headline-only", "ho": true, "img": null, "credit": null, "nw": 0.55, "also": [{"p": "AP (via KTTC)", "u": "https://www.kttc.com/2026/10/13/katie-zacharia-trumps-new-white-house-press-secretary-faces-reporters-first-time/", "pay": false}]}, {"id": "2026-10-17-houthi-missiles-aden-palace", "cat": "middle-east-and-africa", "catName": "Middle East and Africa", "headline": "Houthi missiles hit the presidential palace in Aden as Saudi airports close", "url": "https://wsau.com/?p=1026562", "publisher": "Reuters", "date": "2026-10-15", "summary": "Houthi missiles and drones struck the Maashiq presidential palace in Aden on Thursday, the seat of Yemen's Saudi-backed government, killing five people and wounding 16 by the government's count; the prime minister and his cabinet were unharmed. It was the first attack on the palace in the renewed war, which resumed last month after the 2022 truce collapsed. The Saudi-led coalition said the Houthis had attacked Riyadh's King Khalid airport 20 times this month, killing 17 people, and Riyadh suspended flights after the Houthis declared Saudi airspace unsafe outside Mecca and Medina. The New York Times reported on Saturday that fighting was intensifying around Taiz and that the civilian toll was worsening.", "basis": "Reuters", "ho": false, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQABLAEsAAD/4QCyRXhpZgAATU0AKgAAAAgABQEaAAUAAAABAAAASgEbAAUAAAABAAAAUgEoAAMAAAABAAIAAIKYAAIAAAAFAAAAWodpAAQAAAABAAAAYAAAAAAAAAEsAAAAAQAAASwAAAABVFJRMgAAAASQAwACAAAAFAAAAJagAQADAAAAAQABAACgAgAEAAAAAQAAAtCgAwAEAAAAAQAAAZUAAAAAMjAyNjoxMDoxNSAxNDo0MjowMAD/4Q8jaHR0cDovL25zLmFkb2JlLmNvbS94YXAvMS4wLwA8P3hwYWNrZXQgYmVnaW49Iu+7vyIgaWQ9Ilc1TTBNcENlaGlIenJlU3pOVGN6a2M5ZCI/PiA8eDp4bXBtZXRhIHhtbG5zOng9ImFkb2JlOm5zOm1ldGEvIiB4OnhtcHRrPSJYTVAgQ29yZSA2LjAuMCI+IDxyZGY6UkRGIHhtbG5zOnJkZj0iaHR0cDovL3d3dy53My5vcmcvMTk5OS8wMi8yMi1yZGYtc3ludGF4LW5zIyI+IDxyZGY6RGVzY3JpcHRpb24gcmRmOmFib3V0PSIiIHhtbG5zOmRjPSJodHRwOi8vcHVybC5vcmcvZGMvZWxlbWVudHMvMS4xLyIgeG1sbnM6cGhvdG9zaG9wPSJodHRwOi8vbnMuYWRvYmUuY29tL3Bob3Rvc2hvcC8xLjAvIiB4bWxuczpJcHRjNHhtcEV4dD0iaHR0cDovL2lwdGMub3JnL3N0ZC9JcHRjNHhtcEV4dC8yMDA4LTAyLTI5LyIgeG1sbnM6SXB0YzR4bXBDb3JlPSJodHRwOi8vaXB0Yy5vcmcvc3RkL0lwdGM0eG1wQ29yZS8xLjAveG1sbnMvIiBwaG90b3Nob3A6Q2FwdGlvbldyaXRlcj0iSE0iIHBob3Rvc2hvcDpTb3VyY2U9IlJFVVRFUlMiIHBob3Rvc2hvcDpVcmdlbmN5PSI0IiBwaG90b3Nob3A6Q291bnRyeT0iU0FVREkgQVJBQklBIiBwaG90b3Nob3A6Q2F0ZWdvcnk9Ik is": "headline-only", "ho": true, "img": null, "credit": null, "nw": 0.7, "also": [{"p": "Al Jazeera", "u": "https://aljazeera.com/news/2026/10/9/israeli-settler-attacks-target-palestinian-olive-harvest-in-west-bank", "pay": false}]}, {"id": "2026-10-17-sisi-no-constitution-change", "cat": "middle-east-and-africa", "catName": "Middle East and Africa", "headline": "Sisi says Egypt's constitution will stand, pointing to an exit in 2030", "url": "https://www.thenationalnews.com/news/mena/2026/10/14/el-sisi-says-no-changes-planned-for-egypts-constitution-amid-rumours-of-fourth-term/", "publisher": "The National", "date": "2026-10-14", "summary": "President Abdel Fattah el-Sisi said there are no plans to amend Egypt's constitution, telling a televised gathering of ministers and officers that \"no one can touch it\" and that the people alone would decide any change, after loyalists urged him to stay beyond the end of his final term in 2030. Sisi has ruled since 2014; the 2019 amendments kept a two-term limit while lengthening terms to six years. The New York Times reported on Saturday that he pledged to respect the limits and is seeking parliamentary approval to help defend Saudi Arabia against Houthi attacks.", "basis": "The National", "ho": false, "img": null, "credit": null, "nw": 0.6, "also": [{"p": "New York Times", "u": "https://www.nytimes.com/2026/10/17/world/middleeast/egypt-president-el-sisi-term-limits-2030.html", "pay": true}]}, {"id": "2026-10-17-ai-borrowing-weak-links", "cat": "finance-and-economics", "catName": "Finance and economics", "headline": "Debt markets turn on the AI build-out as CoreWeave bonds trade like distressed credit", "url": "https://investinglive.com/stocks/coreweave-bonds-trade-like-distressed-debt-as-ai-spending-outpaces-balance-sheets/", "publisher": "investingLive (citing CNBC)", "date": "2026-10-15", "summary": "CoreWeave's shares fell about 16 percent on Wednesday and its bonds due in 2032 were yielding close to 15 percent, a level https://taxprofblog.aals.org/2026/09/19/is-the-ai-boom-hollowing-out-corporate-tax-receipts/", "pay": false}]}, {"id": "2026-10-17-deficit-nears-2-trillion", "cat": "finance-and-economics", "catName": "Finance and economics", "headline": "U.S. budget deficit nears $2 trillion on war spending, tariff refunds and interest", "url": "https://www.nytimes.com/2026/10/16/business/us-budget-deficit.html", "publisher": "New York Times", "date": "2026-10-16", "summary": "The federal deficit for the fiscal year that ended September 30 came in near $2 trillion, the New York Times reported, as higher interest rates inflated borrowing costs and the government spent on the Iran war and on refunding tariffs the Supreme Court struck down in February. Refunds ran at $49 billion in June and $33 billion in July alone, leaving net customs receipts negative for three months, against an estimated $166 billion owed in total; the Congressional Budget Office put the war's cost to the Pentagon above $38 billion through August, rising about $3 billion a month.", "basis": "headline-only", "ho": true, "img": null, "credit": null, "nw": 0.75, "also": [{"p": "Bloomberg (via Transport Topics)", "u": "https://www.ttnews.com/articles/deficit-widens-tariff-refunds", "pay": false}]}, {"id": "2026-10-17-alberta-votes-monday-on-secession-path", "cat": "the-americas", "catName": "The Americas", "headline": "Alberta votes Monday on whether to start down the road to secession", "url": "https://abcnews.com/Business/wireStory/canadas-prime-minister-mark-carney-alberta-separation-vote-comes-at-worst-time-137300441", "publisher": "Associated Press", "date": "2026-10-15", "summary": "Albertans vote on Monday on whether the province should remain in Canada or instruct its government to begin the legal process toward a binding referendum on separation; the vote itself is not binding. Prime Minister Mark Carney told a crowd his office put at 5,000 at a \"Forever Canadian\" rally in Calgary on Thursday that the refe gainst Latin America and Africa; under the Rome Statute the withdrawal takes effect after a year and does not halt the ICC's investigation, open since 2021, into alleged crimes against humanity by security forces. Washington welcomed the move.", "basis": "headline-only", "ho": true, "img": null, "credit": null, "nw": 0.65, "also": [{"p": "Al Jazeera", "u": "https://www.aljazeera.com/news/2026/7/27/what-drove-venezuelas-decision-to-leave-the-icc", "pay": false}]}, {"id": "2026-10-17-cuba-private-sector-us-fuel", "cat": "the-americas", "catName": "The Americas", "headline": "Cuba's private businesses are importing American fuel under Trump's blockade", "url": "https://www.wlrn.org/light/americas/2026-10-06/cubas-private-sector-helps-avert-humanitarian-catastrophe-even-though-it-doesnt-exist", "publisher": "WLRN", "date": "2026-10-06", "summary": "Since the United States imposed a de facto fuel blockade on the Cuban government in February, the Trump administration has allowed Cuba's roughly 10,000 private businesses to import American fuel, and they have: U.S. exports to Cuba are up 62 percent this year, mostly to private firms, and diesel that sold for $8 to $10 a liter in the summer now goes for about $2.60, according to WLRN. State-run CUPET has begun renting its filling stations to private distributors. In late September the administration revoked a Biden-era measure that let Cuban business owners open U.S. bank accounts, and Secretary of State Marco Rubio said there is no Cuban economy that benefits the Cuban people.", "basis": "WLRN", "ho": false, "img": null, "credit": null, "nw": 0.55, "also": [{"p": "The Economist", "u": "https://www.economist.com/the-americas/2026/10/15/entrepreneurs-in-cuba-are-snapping-up-american-fuels", "pay": true}]}, {"id": "2026-10-17-peshawar-school-roof-collapse", "cat": "asia", "catName": "Asia", "headline": "School roof collapse in Peshawar kills more than 30 children and a teacher", "url": "https://www.khaleejtimes.com/world/asia/school-roof-collapse-pakistan-peshawar-death-toll?amp=1", "publisher": "Khaleej Times (wire)", "date": "2026-10-15", "summary": "The roof of a private school in Peshawar collapsed during morning classes on Thursday, killing at least 32 children and a teacher by most counts and injuring at least 45; three children were in critical condition with head injuries. Police said the building was structurally weak and its roof overloaded with construction, the owner was arrested, and relatives said their warnings about the building had been ignored. The New York Times reported that the deaths have prompted safety inspections of schools across the region.", "basis": "Khaleej Times", "ho": false, "img": null, "credit": null, "nw": 0.7, "also": [{"p": "New York Times", "u": "https://www.nytimes.com/2026/10/16/world/asia/pakistan-peshawar-school-roof-collapse.html", "pay": true}]}, {"id": "2026-10-17-india-gen-z-protest-leader-bail", "cat": "asia", "catName": "Asia", "headline": "India's Gen Z protest leader released on bail after detention", "url": "https://www.khaleejtimes.com/world/asia/india-cockroach-party-cjp-leaders-abhijeet-saurav-ashutosh-released-detention", "publisher": "Khaleej Times", "date": "2026-10-11", "summary": "Abhijeet Dipke, founder of the Cockroach Janta Party that has led weeks of youth protests against India's chief election commissioner, was released on bail after being detained on his way to a protest, the New York Times reported on Saturday. Delhi police had pulled Dipke and two colleagues off a plane on October 10 ahead of a demonstration demanding the commissioner's resignation over tens of millions of voter-roll deletions, in a crackdown that shut 45 metro stations and detained more than 2,000 people; a magistrate released them the next day on a bond requiring no breach of the peace for a year, which Dipke says he did not sign. The Economist wrote this week that the government has failed to crush the movement.", "basis": "Khaleej Times", "ho": false, "img": null, "credit": null, "nw": 0.65, "also": [{"p": "New York Times", "u": "https://www.nytimes.com/2026/10/17/world/asia/india-abhijeet-dipke-cockroach-janta-party.html", "pay": true}, {"p": "The Economist", "u": "https://www.economist.com/asia/2026/10/13/indias-government-fails-to-crush-gen-z-protests", "pay": true}]}, {"id": "2026-10-17-indonesia-stocks-msci-threat", "cat": "asia", "catName": "Asia", "headline": "Indonesian stocks plunge as MSCI threatens to drop the market from its indexes", "url": "https://www.nytimes.com/2026/10/16/business/indonesia-stocks-economy.html", "publisher": "New York Times", "date": "2026-10-16", "summary": "Indonesian shares fell sharply after the index provider MSCI threatened to remove the country from its benchmarks, the New York Times reported, deepening a crisis of confidence in President Prabowo Subianto's economic policies. MSCI flagged transparency and investability concerns in January, when the Jakarta Composite dropped more than 7 percent in a day, and removed six Indonesian companies from its indexes in May; the index lost roughly a third of its value in the first half of the year as foreign investors sold, amid a wider fiscal deficit, a larger state role in markets and the dismissal of the finance minister.", "basis": "headline-only", "ho": true, "img": null, "credit": null, "nw": 0.6, "also": []}, {"id": "2026-10-17-netflix-layoffs-content-chief", "cat": "business", "catName": "Business", "headline": "Netflix cuts 1,000 jobs and replaces its content chief with Peter Rice", "url": "https://www.thewrap.com/industry-news/business/netflix-chief-content-office-bela-bajaria-out-peter-rice-in/", "publisher": "TheWrap", "date": "2026-10-15", "summary": "Netflix told staff on Wednesday it will cut about 6 percent of its workforce, nearly 1,000 jobs, its largest round since 2022, and on Thursday said chief content officer Bela Bajaria is leaving after a decade. Peter Rice, the former Disney television chairman, takes over global content on October 26. The moves come with Netflix's stock down nearly 40 percent over the past year, engagement up only 2 percent in the first half, and a third-quarter forecast below Wall Street's expectations, despite second-quarter revenue of $12.6 billion and profit of $3.4 billion; third-quarter results are due next week.", "basis": "TheWrap", "ho": false, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBARXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAAqACAAQAAAABAAAC0KADAAQAAAABAAABlQAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/+ICHElDQ19QUk9GSUxFAAEBAAACDGxjbXMCEAAAbW50clJHQiBYWVogB9wAAQAZAAMAKQA5YWNzcEFQUEwAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAPbWAAEAAAAA0y1sY21zAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAKZGVzYwAAAPwAAABeY3BydAAAAVwAAAALd3RwdAAAAWgAAAAUYmtwdAAAAXwAAAAUclhZWgAAAZAAAAAUZ1hZWgAAAaQAAAAUYlhZWgAAAbgAAAAUclRSQwAAAcwAAABAZ1RSQwAAAcwAAABAYlRSQwAAAcwAAABAZGVzYwAAAAAAAAADYzIAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAdGV4dAAAAABGQgAAWFlaIAAAAAAAAPbWAAEAAAAA0y1YWVogAAAAAAAAAxYAAAMzAAACpFhZWiAAAAAAAABvogAAOPUAAAOQWFlaIAAAAAAAAGKZAAC3hQAAGNpYWVogAAAAAAAAJKAAAA+EAAC2z2N1cnYAAAAAAAAAGgAAAMsByQNjBZIIawv2ED8VURs0IfEpkDIYO5JGBVF3Xe1rcHoFibGafKxpv33Tw+kw////wgARCAGVAtADASIAAhEBAxEB/8QAHwAAAQUBAQEBAQEAAAAAAAAAAwIEAQUABgcICQoL/8QAwxAAAQMDAgQDBAYEBwYECAZzAQIAAxEEEiEFMRMiEAZBUTIUYXEjB4EgkUIVoVIzsSRiMBbBctFDkjSCCOFTQCVjFzXwk3OiUESyg/EmVDZklHTCYNKEoxhw4idFN2WzVXWklcOF8tNGdoDjR1ZmtAkKGRooKSo4OTpISUpXWFlaZ2hpand4eXqGh4iJipCWl5iZmqClpqeoqaqwtba3uLm6wMTFxsfIycrQ1NXW19jZ2uDk5ebn6Onq8/T19vf4+fr/xAAfAQADAQEBAQEBAQEBAAAAAAABAgADBAUGBwgJCgv/xADDEQACAgEDAwMCAwUCBQIEBIcBAAIRAxASIQQgMUETBTAiMlEUQAYzI2FCFXFSNIFQJJGhQ7EWB2I1U/DRJWDBROFy8ReCYzZwJkVUkiei0ggJChgZGigpKjc4OTpGR0hJSlVWV1hZWmRlZmdoaWpzdHV2d3h5eoCDhIWGh4iJipCTlJWWl5iZmqCjpKWmp6ipqrCys7S1tre4ubrAwsPExcbHyMnK0NPU1dbX2Nna4OLj5OXm5+jp6vLz9PX29/j5+v/bAEMAAwMDAwMDBgMDBggGBgYICwgICAgLDQsLCwsL  mergers, and a federal jury found in April that Live Nation's practices had harmed the industry in a case the states pursued after the federal government settled. California's own pre-merger notification law takes effect in 2027.", "basis": "headline-only", "ho": true, "img": null, "credit": null, "nw": 0.55, "also": [{"p": "Piedmont Exedra", "u": "https://piedmontexedra.com/2026/05/california-joins-coalition-of-5-states-to-increase-scrutiny-of-monopolies-mergers", "pay": false}]}, {"id": "2026-10-17-china-multilateral-funding-tenfold", "cat": "china", "catName": "China", "headline": "China's funding of development institutions is up tenfold, its say is not", "url": "https://www.thestandard.com.hk/finance/article/344951/Chinas-funding-of-development-institutions-is-up-sharply-but-its-power-still-lags-study-shows", "publisher": "Reuters", "date": "2026-10-08", "summary": "China has raised its funding of multilateral development institutions tenfold since 2010 and is now the fifth-largest donor to the World Bank's fund for the poorest countries after a $1.5 billion pledge, according to a Center for Global Development study released a week before the IMF and World Bank meetings in Bangkok. Its contributions to low-interest multilateral lending rose 92 percent in five years and its multilateral climate finance reached $5.25 billion in 2025, while support for the vaccine alliance Gavi was cut by a third. Its voting share at the World Bank remains about 6 percent, less than half what the bank's formula would give it, against 16 percent and a veto for the United States.", "basis": "Reuters", "ho": false, "img": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAASABIAAD/4QBMRXhpZgAATU0AKgAAAAgAAYdpAAQAAAABAAAAGgAAAAAAA6ABAAMAAAABAAEAAKACAAQAAAABAAAC0KADAAQAAAABAAAB4AAAAAD/7QA4UGhvdG9zaG9wIDMuMAA4QklNBAQAAAAAAAA4QklNBCUAAAAAABDUHYzZjwCyBOmACZjs+EJ+/8AAEQgB4ALQAwEiAAIRAQMRAf/EAB8AAAEFAQEBAQEBAAAAAAAAAAABAgMEBQYHCAkKC//EALUQAAIBAwMCBAMFBQQEAAABfQECAwAEEQUSITFBBhNRYQcicRQygZGhCCNCscE s-push-to-boost-spending", "publisher": "Reuters", "date": "2026-07-16", "summary": "The Economist points this week to falling consumer credit as another warning sign for China's economy, noting that a crackdown on aggressive debt collectors cuts both ways. Household non-performing loans rose by more than a fifth last year to 2.22 trillion yuan, about 1.6 percent of GDP, and as many as one in ten adults may be behind on payments, according to Gavekal Dragonomics; short-term household lending was down 7 percent year on year in June, and growth in the second quarter was the slowest in more than three years. Beijing has tripled its interest subsidy for borrowers, which one TS Lombard economist warned risks adding to the delinquency problem.", "basis": "Reuters", "ho": false, "img": null, "credit": null, "nw": 0.5, "also": [{"p": "The Economist", "u": "https://www.economist.com/finance-and-economics/2026/10/14/another-warning-sign-for-chinas-economy-falling-consumer-credit", "pay": true}]}, {"id": "2026-10-17-oldest-shipwreck-turkey", "cat": "science-and-technology", "catName": "Science and technology", "headline": "Archaeologists say a wreck off Turkey may be the world's oldest, at up to 4,700 years", "url": "https://www.cp24.com/news/world/2026/10/14/worlds-oldest-shipwreck-found-off-coast-of-turkiye/", "publisher": "CNN", "date": "2026-10-14", "summary": "Turkey's culture ministry announced that a wreck found four years ago near Kekova Island, about 30 meters down, carried amphorae dating to 4,400 to 4,700 years ago, which would make it the oldest known shipwreck, older than the roughly 4,200-year-old wreck off Dokos in Greece. The dating rests on comparing the jars' decoration with Egyptian and Levantine examples rather than on radiocarbon analysis, and the wooden hull is gone; clay analysis suggests the jars were made in the Jordan Valley, and the ship may have been sailing toward Troy or Crete. The New York Times reported that outside experts were skeptical but intrigued.", "basis": "CNN (via CP24)", "ho": false, "img": null, "credit": null, "nw": 0.5, "also": [{"p": "New York Times", "u": "https://www.nytimes.com/2026/10/16/world/middleeast/oldest-shipwreck-amphora-turkey.html", "pay": true}]}, {"id": "2026-10-17-economist-leader-russian-diesel", "cat": "leaders", "catName": "Leaders", "headline": "The Economist: Trump's scheme to secure Russian diesel is scandalous", "url": "https://www.economist.com/leaders/2026/10/14/hardly-his-finest-hour", "publisher": "The Economist", "date": "2026-10-14", "summary": "The Economist's leader this week calls Trump's deal to import Russian diesel scandalous. Announced on October 9 after a call with Putin, the deal has Russia supplying more than 300,000 tons of diesel immediately, 500,000 in November and millions more after that, with the Treasury suspending sanctions on those cargoes until April 2027, the first easing beyond a routine license since the war began; the White House has not said who pays or when shipments arrive. The motive is the price at the pump, with U.S. diesel averaging about $6.23 a gallon amid the Iran war and the midterms three weeks away. Zelensky called it \"a weak decision by strong partners.\"", "basis": "AP via NPR (the deal); the leader itself is subscriber-only", "ho": false, "img": null, "credit": null, "nw": 0.7, "also": [{"p": "AP (via NPR/KUOW)", "u": "https://www.kuow.org/npr-news/2026-10-09/trump-says-u-s-to-get-diesel-from-russia-relaxing-pressure-on-moscow-to-ease-prices-before-midterms", "pay": false}]}, {"id": "2026-10-17-economist-briefing-trump-may-save-canada", "cat": "briefing", "catName": "Briefing", "headline": "The Economist asks whether American bullying will shake Canada out of complacency", "url": "https://www.economist.com/briefing/2026/10/15/donald-trump-may-save-canada", "publisher": "The Economist", "date": "2026-10-15", "summary": "This week's Economist briefing, \"Donald Trump may save Canada,\" asks whether U.S. pressure can goad the country out of complacency, in the week Alberta votes on a path to separation. The ingredients are in the news: a trade war in which Washington has put 50 percent tariffs on billions of dollars of Canadian goods, a prime minister whose popularity has risen as he stands up to Trump and pushes Canada toward Europe and Asia, a Globe and Mail report that U.S. Republican operatives met Alberta secession organizers, and Elon Musk posting that Alberta and Saskatchewan should separate. Carney's answer, filmed at his old school in Edmonton: \"We can't build big things on fault lines.\"", "basis": "Al Jazeera (background); the briefing itself is subscriber-only", "ho": false, "img": null, "credit": null, "nw": 0.55, "also": [{"p": "Al Jazeera", "u": "https://aljazeera.com/news/2026/10/12/canadas-carney-calls-for-unity-as-alberta-prepares-for-secession-vote", "pay": false}]}], "closing": "*Run:* ok. 18 agenda feeds fetched, none failed, 191 items in window. 39 candidates read across 12 categories; 27 stories kept; 0 repeats dropped (the archive was empty; this is the first edition). 10 stories are marked as written from headline and description because the article was subscriber-only and nothing else had covered it yet.\n\n*Degraded sources:* none failed. Discovery search produced nothing usable: date-based queries return content farms and stale roundups, so no story in this edition came from discovery.\n\n*Direction handled:* none pending.\n\n*Proposals:*\n- **Weekend mode.** The Economist's weekly batch lands Thursday and Friday and is analysis; a Saturday NYT feed is thin on hard news. A profile could define a weekend edition with fewer stories per category and analysis welcome, instead of the agent guessing. Evidence: today's candidate list, 191 items of which the Economist supplied 65 across seven days and the NYT 126 across two.\n- **Discovery search method.** Replace the per-category date query with topical queries restricted to wire-service domains, or drop discovery     const top = `<section class="top"><h2>Top stories</h2><ol>${D.top.map(id => { const s = byId[id]; return `<li><a href="#r-${s.id}">${esc(s.headline)}</a><span class="lede">${esc(firstSentence(s.summary))}</span></li>`; }).join("")}</ol></section>`;
    const secs = groups().map(g => `<h2 class="cat" id="r-cat-${g.id}">${esc(g.name)}</h2>` + g.stories.map(s => `
      <article id="r-${s.id}"><h3>${esc(s.headline)}</h3>${meta(s)}<p>${esc(s.summary)}</p>${also(s)}</article>`).join("")).join("");
    return `<div class="reader"><p class="note">A. Reader. One column, a measure of about 65 characters, no images. Built for dyslexia-friendly reading: left-aligned, generous line height, bold for emphasis, nothing italic or justified. Try it in Lexend or Atkinson Hyperlegible with the controls above.</p>
      <header class="masthead"><h1>${esc(D.profile)}</h1><div class="date">${esc(ledeDate)}</div></header>${top}${secs}</div>`;
  }

  function editorial() {
    const tops = D.top.map(id => byId[id]);
    const card = (s, lead) => `<article class="card ${lead ? "lead" : ""} ${s.img ? "" : "noimg"}">
      ${s.img ? `<figure style="margin:0"><img src="${s.img}" alt=""><figcaption>${esc(s.credit || s.publisher)}</figcaption></figure>` : `<div class="ph">no image available</div>`}
      <span class="kicker">${esc(s.catName)}</span><h3><a href="#e-${s.id}" style="text-decoration:none">${esc(s.headline)}</a></h3><p>${esc(lead ? s.summary : firstSentence(s.summary))}</p><div style="margin-top:.4rem">${meta(s)}</div></article>`;
    const topgrid = `<section class="topgrid">${card(tops[0], true)}${card(tops[1], false)}${card(tops[2], false)}</section>`;
    const secs = groups().map(g => `<section class="section" id="e-cat-${g.id}"><span class="kicker">${esc(g.name)}</span>` + g.stories.map(s => `
      <article class="row ${s.img ? "hasimg" : ""}" id="e-${s.id}">${s.img ? `<figure style="margin:0"><img src="${s.img}" alt=""><figcaption>${esc(s.credit || s.publisher)}</figcaption></figure>` : ""}<div><h3>${esc(s.headline)}</h3>${meta(s)}<p>${esc(s.summary)}</p>${also(s)}</div></article>`).join("") + `</section>`).join("");
    return `<div class="editorial"><p class="note">B. Editorial. A newspaper front: lead story with a photo, two secondaries, then sections with a kicker and thumbnails where a photo exists. Photos are the preview images from the coverage pages, credited; four of today's publishers refused the fetch, which is why some rows have none.</p>
      <header class="masthead"><h1>${esc(D.profile)}</h1><div class="date">${esc(ledeDate)}</div></header>${topgrid}${secs}</div>`;
  }

  function scan() {
    const gs = groups();
    const chips = `<nav class="chips">${gs.map(g => `<a href="#s-cat-${g.id}">${esc(g.name)} <span class="sub">${g.stories.length}</span></a>`).join("")}</nav>`;
    const top = `<section class="top">${D.top.map(id => `<div><a href="#s-${byId[id].id}" style="text-decoration:none">${esc(byId[id].headline)}</a></div>`).join("")}</section>`;
    const secs = gs.map(g => `<h2 class="cat" id="s-cat-${g.id}"><span>${esc(g.name)}</span><span>${g.stories.length}</span></h2>` + g.stories.map(s => `
      <details id="s-${s.id}"><summary class="${s.img ? "hasimg" : ""}">${s.img ? `<img src="${s.img}" alt="">` : ""}<span class="h">${esc(s.headline)}</span><span class="l">${esc(firstSentence(s.summary))}</span></summary>
      <div class="body">${meta(s)}<p>${esc(s.summary)}</p>${also(s)}</div></details>`).join("")).join("");
    return `<div class="scan"><p class="note">C. Scan. Dense: a sticky category strip, headline plus first sentence per story, tap to expand. Thumbnails where available. Built for a two-minute pass that can become a ten-minute read.</p>
      <header class="masthead"><h1>${esc(D.profile)}</h1><span class="sub">${esc(ledeDate)}</span></header>${chips}${top}${secs}</div>`;
  }

  const layouts = { reader, editorial, scan };
  const app = document.getElementById("app");
  const root = document.documentElement;
  const prefs = { layout: "reader", font: "serif", size: "normal" };
  try { Object.assign(prefs, JSON.parse(localStorage.getItem("pp_mock_prefs") || "{}")); } catch (e) {}
  function save() { try { localStorage.setItem("pp_mock_prefs", JSON.stringify(prefs)); } catch (e) {} }
  function apply() {
    root.setAttribute("data-font", prefs.font); root.setAttribute("data-size", prefs.size);
    document.getElementById("font").value = prefs.font;
    document.querySelectorAll("[data-layout]").forEach(b => b.setAttribute("aria-pressed", b.dataset.layout === prefs.layout ? "true" : "false"));
    document.querySelectorAll("[data-size]").forEach(b => b.setAttribute("aria-pressed", b.dataset.size === prefs.size ? "true" : "false"));
    app.innerHTML = layouts[prefs.layout]();
  }
  document.querySelectorAll("[data-layout]").forEach(b => b.addEventListener("click", () => { prefs.layout = b.dataset.layout; save(); apply(); window.scrollTo(0, 0); }));
  document.querySelectorAll("[data-size]").forEach(b => b.addEventListener("click", () => { prefs.size = b.dataset.size; save(); apply(); }));
  document.getElementById("font").addEventListener("change", e => { prefs.font = e.target.value; save(); apply(); });
  apply();
})();
</script>
