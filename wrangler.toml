# PersonalPaper hosted environment: Cloudflare Worker + D1.
# Deploy: npx wrangler deploy        Local: npx wrangler dev
# Anyone deploying their own environment changes `name`, the D1 ids, and `routes`.

name = "personal-paper"
main = "hosted/worker/index.js"
compatibility_date = "2026-10-01"
workers_dev = true

# Custom domain: creates the DNS record and certificate on deploy.
routes = [
  { pattern = "personalpaper.org", custom_domain = true }
]

[[d1_databases]]
binding = "DB"
database_name = "personal-paper"
database_id = "30d2b763-cd45-4b62-a7dc-6accc59215f2"

[observability]
enabled = true

# Secrets (not in this file): WRITE_TOKEN, set with `npx wrangler secret put WRITE_TOKEN`.
# For local dev, put WRITE_TOKEN=... in .dev.vars (gitignored).
